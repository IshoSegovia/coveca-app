<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COVECA – Prueba de impresión</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="impresion-animada.css">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--fuente); background:var(--fondo); color:var(--texto); font-size:16px; }
    header { background:var(--azul); color:#fff; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); }
    header h1 { margin:0; font-size:22px; font-weight:700; }
    header p { margin:4px 0 0; font-size:14px; opacity:.9; }
    main { padding:16px; max-width:480px; margin:0 auto; }
    .logo { display:block; width:220px; margin:8px auto 16px; }
    ol { padding-left:20px; color:var(--texto-suave); line-height:1.5; margin:0; }
    label { display:block; font-weight:600; margin:24px 0 8px; }
    select, button { width:100%; font:inherit; font-size:17px; min-height:52px; padding:12px; border-radius:var(--radio); }
    select { border:1px solid var(--borde); background:var(--superficie); color:var(--texto); }
    button { border:0; margin-top:12px; font-weight:600; cursor:pointer; }
    #buscar { background:var(--superficie); color:var(--azul); border:2px solid var(--azul); }
    #imprimir { background:var(--azul); color:#fff; }
    #imprimir:active { background:var(--azul-oscuro); }
    #estado { margin-top:16px; padding:12px; border-radius:var(--radio); background:var(--superficie); border:1px solid var(--borde); min-height:48px; }
    #estado.ok { color:var(--verde); } #estado.error { color:var(--rojo-texto); }
  </style>
</head>
<body>
  <header><h1>Prueba de impresión</h1><p>Etapa 0</p></header>
  <main>
    <img class="logo" src="logo-color.png" alt="COVECA">
    <ol>
      <li>Enciende la impresora RPP02N.</li>
      <li>Verifica que esté vinculada en Ajustes &gt; Bluetooth.</li>
      <li>Presiona <b>Buscar impresoras</b>, elígela y presiona <b>Imprimir nota de prueba</b>.</li>
    </ol>
    <label for="impresora">Impresora</label>
    <select id="impresora"></select>
    <button id="buscar">Buscar impresoras</button>
    <label for="modo">Modo de impresión</label>
    <select id="modo">
      <option value="texto">Texto + logo (rápido)</option>
      <option value="imagen">Imagen completa (como Loyverse)</option>
    </select>
    <button id="imprimir">Imprimir nota de prueba</button>
    <div id="estado">Listo para probar.</div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
