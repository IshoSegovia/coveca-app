<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3E4095">
  <title>COVECA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="impresion-animada.css">
</head>
<body>
  <header id="cabecera" class="cabecera"></header>
  <main id="vista" class="vista"></main>
  <div id="pie-accion" class="pie-accion" hidden></div>
  <nav id="navegacion" class="navegacion" aria-label="Secciones">
    <a href="#/rutas" data-tab="rutas"></a>
    <a href="#/clientes" data-tab="clientes"></a>
    <a href="#/inventario" data-tab="inventario"></a>
    <a href="#/mas" data-tab="mas"></a>
  </nav>
  <script src="vendor/qrcode.js"></script>
  <script type="module">
    import { ICONOS } from './nucleo.js';
    const nombres = { rutas: 'Rutas', clientes: 'Clientes', inventario: 'Inventario', mas: 'Más' };
    document.querySelectorAll('#navegacion a').forEach((a) => {
      a.innerHTML = `${ICONOS[a.dataset.tab]}<span>${nombres[a.dataset.tab]}</span>`;
    });
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
