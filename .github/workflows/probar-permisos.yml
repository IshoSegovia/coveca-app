name: Probar permisos

# Simula, como cada vendedor, subir fotos a Storage y guardar datos. Todo dentro de una
# transacción que se deshace al final (no deja cambios).
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simular acciones con cada usuario
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for correo in $(psql "$DB_URL" -tAc "select correo from vendedores where activo"); do
            uid=$(psql "$DB_URL" -tAc "select id from vendedores where correo = '$correo'")
            r=$(psql "$DB_URL" -tA -v ON_ERROR_STOP=1 2>&1 <<SQL || true
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', '$uid', 'role', 'authenticated')::text, true);
          select set_config('request.jwt.claim.sub', '$uid', true);
          set local role authenticated;
          insert into storage.objects (bucket_id, name, owner_id) values ('productos', 'prueba/x.jpg', '$uid');
          insert into storage.objects (bucket_id, name, owner_id) values ('clientes', 'prueba/x.jpg', '$uid');
          select count(*) from storage.objects where name = 'prueba/x.jpg';
          update productos set imagen_url = imagen_url where id = (select min(id) from productos);
          select public.foto_cliente((select min(id) from clientes), null);
          rollback;
          select 'TODO OK';
          SQL
          )
            echo "::notice::$correo → $(echo "$r" | tr '\n' ' ' | cut -c1-400)"
          done
