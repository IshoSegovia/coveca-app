name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar firma fija (si el secreto existe)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/coveca.jks"
            echo "COVECA_KEYSTORE=$RUNNER_TEMP/coveca.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada"
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_B64: el APK se firma con una llave temporal"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          COVECA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log; then
            # Deja el motivo del error como anotación visible en GitHub.
            grep -A6 "What went wrong" gradle.log | head -12 | tr '\n' ' ' | sed 's/^/::error::/'; echo
            grep -m3 "error:" gradle.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: coveca-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar en Releases (enlace fijo para descargar desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk coveca.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima coveca.apk \
            --title "COVECA – última versión" \
            --notes "Versión generada desde el commit ${GITHUB_SHA::7}. Descarga coveca.apk e instálalo en el celular." \
            --latest
